name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: .

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Migration chain
        run: uv run pytest -q tests/test_migrations_watchlist.py::test_watchlist_migrations_are_chained_to_head

      - name: Pytest
        run: |
          uv run pytest -q \
            --deselect tests/test_masters.py::test_apply_appends_transaction_and_updates_security \
            --deselect tests/test_pivot_bhav.py::test_prune_keeps_only_20_sessions

      - name: Worker idle smoke
        run: uv run pytest -q tests/test_deploy_cli.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t pms-api:ci .

      - name: Build UI image
        run: docker build -t pms-ui:ci ./app

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
